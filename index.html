<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Minimal Page</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      line-height: 1.5;
    }
    @media (max-width: 400px) {
      .container {
        width: 90%;
        font-size: 1rem;
      }
    }
    @media (max-width: 768px) {
      .container {
        width: 90%;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <p>Hello, world!</p>
  </div>
</body>
</html>
